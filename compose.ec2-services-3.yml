name: gym-services-3

x-defaults: &defaults
  restart: unless-stopped
  networks: [backend]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 20s

services:
  membership-service:
    <<: *defaults
    image: ${REGISTRY:-draven168}/gym-membership:v1
    env_file: ./membership-service/.env
    environment:
      NODE_ENV: production
      PORT: 5003
      SERVER_NAME: membership-server-2
    ports:
      - "5003:5003"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5003/"]

  class-service:
    <<: *defaults
    image: ${REGISTRY:-draven168}/gym-class:v1
    env_file: ./class-service/.env
    environment:
      NODE_ENV: production
      PORT: 5005
    ports:
      - "5005:5005"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5005/"]

  booking-service:
    <<: *defaults
    image: ${REGISTRY:-draven168}/gym-booking:v2
    env_file: ./booking-service/.env
    environment:
      NODE_ENV: production
      PORT: 5006
    ports:
      - "5006:5006"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5006/"]

networks:
  backend:
