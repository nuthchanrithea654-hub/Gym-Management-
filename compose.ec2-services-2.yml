name: gym-services-2

x-defaults: &defaults
  restart: unless-stopped
  networks: [backend]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 20s

services:
  membership-service:
    <<: *defaults
    image: ${REGISTRY:-draven168}/gym-membership:v1
    env_file: ./membership-service/.env
    environment:
      NODE_ENV: production
      PORT: 5003
      SERVER_NAME: membership-server-1
    ports:
      - "5003:5003"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5003/"]

  payment-service:
    <<: *defaults
    image: ${REGISTRY:-draven168}/gym-payment:v1
    env_file: ./payment-service/.env
    environment:
      NODE_ENV: production
      PORT: 5004
    ports:
      - "5004:5004"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5004/"]

networks:
  backend:
