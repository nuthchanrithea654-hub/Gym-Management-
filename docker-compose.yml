services:
  registration-service:
    build: ./registration-service
    container_name: registration-service
    env_file:
      - ./registration-service/.env
    ports:
      - "5001:5001"

  login-service:
    build: ./login-service
    container_name: login-service
    env_file:
      - ./login-service/.env
    ports:
      - "5002:5002"

  membership-service-1:
    image: draven168/gym-membership:v1
    container_name: membership-service-1
    env_file:
      - ./membership-service/.env
    environment:
      SERVER_NAME: membership-server-1
    ports:
      - "5003:5003"

  membership-service-2:
    image: draven168/gym-membership:v1
    container_name: membership-service-2
    env_file:
      - ./membership-service/.env
    environment:
      SERVER_NAME: membership-server-2

  payment-service:
    build: ./payment-service
    container_name: payment-service
    env_file:
      - ./payment-service/.env
    ports:
      - "5004:5004"

  class-service:
    build: ./class-service
    container_name: class-service
    env_file:
      - ./class-service/.env
    ports:
      - "5005:5005"

  booking-service:
    build: ./booking-service
    container_name: booking-service
    env_file:
      - ./booking-service/.env
    ports:
      - "5006:5006"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    env_file:
      - ./api-gateway/.env
    ports:
      - "5050:5050"
    depends_on:
      - registration-service
      - login-service
      - membership-service-1
      - membership-service-2
      - payment-service
      - class-service
      - booking-service

  nginx:
    image: nginx:alpine
    container_name: gym-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - membership-service-1
      - membership-service-2