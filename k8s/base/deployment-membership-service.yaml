---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: membership-service
  namespace: gym-management
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: membership-service
  template:
    metadata:
      labels:
        app: membership-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: membership-service
        image: gym/membership-service:k8s-v1
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 5003
        envFrom:
        - configMapRef:
            name: gym-config
        env:
        - name: PORT
          value: '5003'
        - name: SERVER_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: gym-secrets
              key: MEMBERSHIP_MONGO_URI
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gym-secrets
              key: JWT_SECRET
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: "/"
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: "/"
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: "/readyz"
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
