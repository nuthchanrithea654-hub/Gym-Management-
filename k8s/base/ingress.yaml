---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gym-ingress
  namespace: gym-management
spec:
  ingressClassName: nginx
  rules:
  - host: gym.aupp.com
    http:
      paths:
      - path: "/register"
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 5050
      - path: "/login"
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 5050
      - path: "/memberships"
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 5050
      - path: "/payments"
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 5050
      - path: "/classes"
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 5050
      - path: "/bookings"
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 5050
      - path: "/server"
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 5050
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 5050
