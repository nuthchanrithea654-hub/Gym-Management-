events {}

http {
    # Membership replicas, load balanced round-robin
    upstream membership_backend {
        server membership-service-1:5003;
        server membership-service-2:5003;
    }

    server {
        listen 80;

        # Used by the Docker healthcheck
        location = /health {
            access_log off;
            return 200 'ok';
        }

        location /server {
            proxy_pass http://membership_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /memberships {
            proxy_pass http://membership_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Nginx sits behind the API gateway and only serves membership routes
        location / {
            return 404;
        }
    }
}
