events {}

http {
    upstream membership_backend {
        server membership-service-1:5003;
        server membership-service-2:5003;
    }

    server {
        listen 80;

        location /server {
            proxy_pass http://membership_backend;
        }
        
        location /memberships/ {
            proxy_pass http://membership_backend;
        }

        location / {
            proxy_pass http://api-gateway:5050;
        }
    }
}